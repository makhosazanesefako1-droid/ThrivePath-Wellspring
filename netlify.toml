[build]
  command = "npm run build"
  publish = "dist"

[env]
  [env.production]
    VITE_API_URL = "https://your-api-domain.com"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
